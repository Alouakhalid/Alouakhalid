<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="mneon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <clipPath id="mclip"><rect width="1200" height="150" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#mclip)">
    <rect width="1200" height="150" fill="url(#mbg)"/>

    <!-- Pipeline: ENCODER -> ATTENTION -> DECODER -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="700">
      <g transform="translate(70, 52)">
        <rect width="200" height="46" rx="10" fill="#181926" stroke="#00f0ff" stroke-opacity="0.7" stroke-width="1.4"/>
        <text x="100" y="30" text-anchor="middle" fill="#00f0ff">ViT ENCODER</text>
      </g>
      <g transform="translate(500, 52)">
        <rect width="200" height="46" rx="10" fill="#181926" stroke="#7928ca" stroke-opacity="0.7" stroke-width="1.4"/>
        <text x="100" y="30" text-anchor="middle" fill="#a78bfa">CROSS-ATTENTION</text>
      </g>
      <g transform="translate(930, 52)">
        <rect width="200" height="46" rx="10" fill="#181926" stroke="#ff007f" stroke-opacity="0.7" stroke-width="1.4"/>
        <text x="100" y="30" text-anchor="middle" fill="#ff007f">RoBERTa DECODER</text>
      </g>
    </g>

    <!-- Connecting pipes -->
    <line x1="270" y1="75" x2="500" y2="75" stroke="url(#mneon)" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="700" y1="75" x2="930" y2="75" stroke="url(#mneon)" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Flowing data pulses -->
    <circle r="4" fill="#00f0ff">
      <animateMotion dur="2s" repeatCount="indefinite" path="M270,75 L500,75"/>
    </circle>
    <circle r="4" fill="#ff007f">
      <animateMotion dur="2s" begin="0.7s" repeatCount="indefinite" path="M700,75 L930,75"/>
    </circle>
    <circle r="4" fill="#00e676">
      <animateMotion dur="2s" begin="1.3s" repeatCount="indefinite" path="M270,75 L500,75"/>
    </circle>

    <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="2">
      TRANSFORMER OCR PIPELINE • IMAGE → ATTENTION → ARABIC TEXT
    </text>
  </g>
</svg>
