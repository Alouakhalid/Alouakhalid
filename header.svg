<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0080"><animate attributeName="stop-color" values="#ff0080;#7928ca;#00b4d8;#ff0080" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#7928ca"><animate attributeName="stop-color" values="#7928ca;#00b4d8;#ff0080;#7928ca" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00b4d8"><animate attributeName="stop-color" values="#00b4d8;#ff0080;#7928ca;#00b4d8" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3f4"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <!-- neural-net lines -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2">
      <line x1="80" y1="60" x2="220" y2="150"/><line x1="220" y1="150" x2="130" y2="215"/>
      <line x1="220" y1="150" x2="340" y2="70"/><line x1="340" y1="70" x2="420" y2="190"/>
      <line x1="860" y1="70" x2="980" y2="160"/><line x1="980" y1="160" x2="1090" y2="70"/>
      <line x1="980" y1="160" x2="900" y2="220"/><line x1="1090" y1="70" x2="1130" y2="200"/>
    </g>
    <!-- floating nodes -->
    <g fill="#ffffff">
      <circle cx="80" cy="60" r="5" fill-opacity="0.7"><animate attributeName="cy" values="60;75;60" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="150" r="7" fill-opacity="0.8"><animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="215" r="5" fill-opacity="0.6"><animate attributeName="cy" values="215;200;215" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="70" r="6" fill-opacity="0.7"><animate attributeName="cy" values="70;85;70" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="190" r="5" fill-opacity="0.6"><animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="70" r="5" fill-opacity="0.6"><animate attributeName="cy" values="70;55;70" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="160" r="8" fill-opacity="0.8"><animate attributeName="r" values="8;11;8" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="70" r="6" fill-opacity="0.7"><animate attributeName="cy" values="70;85;70" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="220" r="5" fill-opacity="0.6"/>
      <circle cx="1130" cy="200" r="5" fill-opacity="0.6"><animate attributeName="cy" values="200;185;200" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#txt)" letter-spacing="2">
      Ali Khalid
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="600" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.95">
      AI Engineer  •  Deep Learning Researcher  •  NLP &amp; Computer Vision
      <animate attributeName="opacity" values="0;1" begin="0.8s" dur="1.4s" fill="freeze"/>
    </text>
    <text x="600" y="215" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#ffffff" fill-opacity="0.8">
      Cairo, Egypt  |  Hugging Face  |  Open to Collab
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
