      <line x1="80" y1="302" x2="1120" y2="302" stroke="url(#hneon)" stroke-opacity="0.35" stroke-width="1.2"><animate attributeName="y1" values="302;358" dur="3s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="y2" values="302;358" dur="3s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0;0.4;0.05" dur="3s" begin="-2.5s" repeatCount="indefinite"/></line>
