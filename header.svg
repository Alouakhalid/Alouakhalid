<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>

    <!-- Animated Neon Wave Accent -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00f0ff;#00e676;#ff007f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#00f0ff;#00e676;#ff007f;#7928ca" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#00e676;#ff007f;#7928ca;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e676">
        <animate attributeName="stop-color" values="#00e676;#ff007f;#7928ca;#00f0ff;#00e676" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <clipPath id="cardClip">
      <rect width="1200" height="280" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Canvas -->
    <rect width="1200" height="280" fill="url(#bgGradient)"/>

    <!-- Subtle Tech Grid -->
    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <line x1="0" y1="40" x2="1200" y2="40"/>
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="100" y1="0" x2="100" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="500" y1="0" x2="500" y2="280"/>
      <line x1="700" y1="0" x2="700" y2="280"/>
      <line x1="900" y1="0" x2="900" y2="280"/>
      <line x1="1100" y1="0" x2="1100" y2="280"/>
    </g>

    <!-- Neural Network Synapse Lines (Left & Right) -->
    <g stroke="url(#neonGlow)" stroke-opacity="0.35" stroke-width="1.4">
      <line x1="60" y1="60" x2="180" y2="130"/>
      <line x1="180" y1="130" x2="110" y2="220"/>
      <line x1="180" y1="130" x2="280" y2="70"/>
      <line x1="280" y1="70" x2="260" y2="210"/>
      <line x1="260" y1="210" x2="360" y2="160"/>
      
      <line x1="840" y1="160" x2="940" y2="70"/>
      <line x1="940" y1="70" x2="1020" y2="190"/>
      <line x1="1020" y1="190" x2="1140" y2="80"/>
      <line x1="1020" y1="190" x2="1100" y2="230"/>
      <line x1="940" y1="70" x2="1060" y2="60"/>
    </g>

    <!-- Pulsing Neural Nodes -->
    <g>
      <circle cx="60" cy="60" r="4.5" fill="#ff007f">
        <animate attributeName="r" values="4;6.5;4" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="130" r="7" fill="#7928ca">
        <animate attributeName="r" values="6;9;6" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="220" r="5" fill="#00f0ff">
        <animate attributeName="cy" values="220;210;220" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="70" r="5" fill="#00e676">
        <animate attributeName="r" values="4.5;7;4.5" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="210" r="5.5" fill="#ff007f">
        <animate attributeName="cy" values="210;222;210" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="360" cy="160" r="4" fill="#00f0ff">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="840" cy="160" r="4.5" fill="#00f0ff">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="940" cy="70" r="6" fill="#ff007f">
        <animate attributeName="r" values="5;8;5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="190" r="7.5" fill="#7928ca">
        <animate attributeName="r" values="6.5;9.5;6.5" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1140" cy="80" r="5" fill="#00e676">
        <animate attributeName="cy" values="80;70;80" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="230" r="4.5" fill="#ff007f">
        <animate attributeName="r" values="4;6.5;4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="60" r="4" fill="#00f0ff">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Top Glow Border -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#neonGlow)"/>

    <!-- Center Content -->
    <g transform="translate(470, 36)">
      <rect width="260" height="30" rx="15" fill="#1e1e38" fill-opacity="0.8" stroke="url(#neonGlow)" stroke-width="1.2"/>
      <circle cx="22" cy="15" r="4.5" fill="#00e676">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1">
        AI RESEARCHER &amp; ROBOTICIST
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="3" filter="url(#glow)">
      ALI KHALID
    </text>

    <!-- Subtitle Role Bar -->
    <text x="600" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f43f5e" letter-spacing="2">
      <tspan fill="#ff007f">NLP &amp; ARABIC OCR</tspan>
      <tspan fill="#7928ca"> • </tspan>
      <tspan fill="#00f0ff">COMPUTER VISION</tspan>
      <tspan fill="#7928ca"> • </tspan>
      <tspan fill="#00e676">ROBOTIC SOFTWARE</tspan>
    </text>

    <!-- Detail Tag Pills -->
    <g transform="translate(230, 202)">
      <g transform="translate(0, 0)">
        <rect width="210" height="34" rx="17" fill="#181926" stroke="#ff007f" stroke-opacity="0.6" stroke-width="1"/>
        <text x="105" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fed7aa">
          🔥 Qalam-Net: 35.8k+ HF
        </text>
      </g>
      <g transform="translate(225, 0)">
        <rect width="270" height="34" rx="17" fill="#181926" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1"/>
        <text x="135" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5f3fc">
          🎓 Mechatronics Eng. @ E-JUST
        </text>
      </g>
      <g transform="translate(510, 0)">
        <rect width="230" height="34" rx="17" fill="#181926" stroke="#00e676" stroke-opacity="0.6" stroke-width="1"/>
        <text x="115" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bbf7d0">
          📍 Cairo, Egypt • Open to Collab
        </text>
      </g>
    </g>

    <!-- Bottom Laser Line -->
    <rect x="0" y="276" width="1200" height="4" fill="url(#neonGlow)"/>
  </g>
</svg>
