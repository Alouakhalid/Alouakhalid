      <text x="600" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" letter-spacing="5" fill="#f7b93e" opacity="0">ROBOTIC SOFTWARE BUILDER<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12s" begin="-9s" repeatCount="indefinite"/></text>
