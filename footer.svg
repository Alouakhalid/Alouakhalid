<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00f0ff;#ff007f" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#00f0ff;#ff007f;#7928ca" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff007f;#7928ca;#00f0ff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>

  <path fill="url(#waveGrad1)" fill-opacity="0.3" d="M0,60 C300,110 600,20 900,80 C1050,110 1150,50 1200,60 L1200,150 L0,150 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,60 C300,110 600,20 900,80 C1050,110 1150,50 1200,60 L1200,150 L0,150 Z;
        M0,70 C250,20 550,110 850,30 C1000,70 1120,100 1200,70 L1200,150 L0,150 Z;
        M0,60 C300,110 600,20 900,80 C1050,110 1150,50 1200,60 L1200,150 L0,150 Z
      "/>
  </path>

  <path fill="url(#waveGrad2)" fill-opacity="0.75" d="M0,90 C350,40 650,120 950,70 C1080,45 1160,85 1200,90 L1200,150 L0,150 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
        M0,90 C350,40 650,120 950,70 C1080,45 1160,85 1200,90 L1200,150 L0,150 Z;
        M0,80 C280,125 580,55 880,105 C1020,130 1140,75 1200,80 L1200,150 L0,150 Z;
        M0,90 C350,40 650,120 950,70 C1080,45 1160,85 1200,90 L1200,150 L0,150 Z
      "/>
  </path>

  <line x1="0" y1="148" x2="1200" y2="148" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"/>
</svg>
