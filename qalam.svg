<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="qbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="qneon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="qbeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="qglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="qclip"><rect width="1200" height="340" rx="20"/></clipPath>
    <clipPath id="qdoc"><rect x="90" y="96" width="300" height="190" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#qclip)">
    <rect width="1200" height="340" fill="url(#qbg)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#qneon)"/>
    <rect x="0" y="337" width="1200" height="3" fill="url(#qneon)"/>

    <text x="600" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="4" fill="#e0e7ff" filter="url(#qglow)">QALAM-NET V2 • ARABIC OCR ENGINE</text>
    <text x="600" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#94a3b8">TrOCR 0.3B — ViT ENCODER + RoBERTa DECODER — END-TO-END, NO SEGMENTATION</text>

    <!-- INPUT document -->
    <rect x="90" y="96" width="300" height="190" rx="12" fill="#181926" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="240" y="122" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#00f0ff" letter-spacing="3">INPUT • ARABIC SCRIPT</text>
    <text x="240" y="196" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Amiri', serif" font-size="64" fill="#f8fafc">قلم</text>
    <g stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity="0.6">
      <line x1="130" y1="228" x2="350" y2="228"/>
      <line x1="150" y1="246" x2="330" y2="246"/>
      <line x1="170" y1="264" x2="310" y2="264"/>
    </g>
    <g clip-path="url(#qdoc)">
      <rect x="90" y="96" width="300" height="34" fill="url(#qbeam)">
        <animate attributeName="y" values="96;252;96" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <line x1="90" y1="130" x2="390" y2="130" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.9">
        <animate attributeName="y1" values="96;286;96" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="96;286;96" dur="3.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Flow pipes -->
    <line x1="400" y1="170" x2="790" y2="170" stroke="url(#qneon)" stroke-width="2.4" stroke-opacity="0.5"/>
    <line x1="400" y1="215" x2="790" y2="215" stroke="url(#qneon)" stroke-width="2.4" stroke-opacity="0.5"/>
    <circle r="4.5" fill="#00f0ff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M400,170 L790,170"/></circle>
    <circle r="4.5" fill="#ff007f"><animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M400,170 L790,170"/></circle>
    <circle r="4.5" fill="#00e676"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M400,170 L790,170"/></circle>
    <circle r="4" fill="#ffd700"><animateMotion dur="2.2s" repeatCount="indefinite" path="M790,215 L400,215"/></circle>
    <circle r="4" fill="#7928ca"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" path="M790,215 L400,215"/></circle>
    <text x="595" y="156" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#a78bfa" letter-spacing="2">VISUAL FEATURES →</text>
    <text x="595" y="240" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#a78bfa" letter-spacing="2">← CONTEXT / ATTENTION</text>

    <!-- OUTPUT card -->
    <rect x="800" y="96" width="310" height="190" rx="12" fill="#181926" stroke="#ff007f" stroke-opacity="0.55" stroke-width="1.4"/>
    <text x="955" y="122" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#ff007f" letter-spacing="3">OUTPUT • RECOGNIZED TEXT</text>
    <text x="955" y="196" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Amiri', serif" font-size="64" fill="#00e676" opacity="0">قلم
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.6;0.9;1" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="955" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">SEQUENCE-TO-SEQUENCE DECODING</text>

    <text x="600" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFD21E" letter-spacing="1.5">🔥 36k+ downloads on Hugging Face • fine-tuned from microsoft/trocr-base-handwritten</text>
  </g>
</svg>
