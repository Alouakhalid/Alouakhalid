<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="tneon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#7928ca;#00f0ff;#00e676;#ff007f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#00f0ff;#00e676;#ff007f;#7928ca" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#00e676;#ff007f;#7928ca;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tclip"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#tclip)">
    <rect width="1200" height="280" fill="url(#tbg)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#tneon)"/>
    <rect x="0" y="277" width="1200" height="3" fill="url(#tneon)"/>

    <text x="600" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#e0e7ff" letter-spacing="4" filter="url(#tglow)">VERIFIED HONORS &amp; TROPHIES</text>

    <!-- Card template instances: 3 columns x 2 rows -->
    <!-- Card 1: ECPC -->
    <g transform="translate(40, 58)">
      <rect width="360" height="92" rx="14" fill="#181926" stroke="#FFD700" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="24" y="58" font-size="40">🏆</text>
      <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFD700">ECPC FINALIST</text>
      <text x="80" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">Rank 61 of 600+ Teams</text>
      <circle cx="336" cy="18" r="3.5" fill="#FFD700">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Card 2: Qalam-Net -->
    <g transform="translate(420, 58)">
      <rect width="360" height="92" rx="14" fill="#181926" stroke="#ff007f" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="24" y="58" font-size="40">🔥</text>
      <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ff007f">QALAM-NET V2 OCR</text>
      <text x="80" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">36k+ Hugging Face Downloads</text>
      <circle cx="336" cy="18" r="3.5" fill="#ff007f">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Card 3: NTI -->
    <g transform="translate(800, 58)">
      <rect width="360" height="92" rx="14" fill="#181926" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="24" y="58" font-size="40">🧠</text>
      <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#00f0ff">NTI NLP HONORS</text>
      <text x="80" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">97.8% Final Evaluation Score</text>
      <circle cx="336" cy="18" r="3.5" fill="#00f0ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Card 4: E-JUST thesis -->
    <g transform="translate(40, 168)">
      <rect width="360" height="92" rx="14" fill="#181926" stroke="#00e676" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="24" y="58" font-size="40">🦾</text>
      <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#00e676">E-JUST MECHATRONICS</text>
      <text x="80" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">Thesis: Robotic Arm Control</text>
      <circle cx="336" cy="18" r="3.5" fill="#00e676">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Card 5: Certifications -->
    <g transform="translate(420, 168)">
      <rect width="360" height="92" rx="14" fill="#181926" stroke="#7928ca" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="24" y="58" font-size="40">💎</text>
      <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#a78bfa">CERTIFIED ENGINEER</text>
      <text x="80" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">IBM • DataCamp • AWS • NVIDIA/ITI</text>
      <circle cx="336" cy="18" r="3.5" fill="#7928ca">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Card 6: Open source -->
    <g transform="translate(800, 168)">
      <rect width="360" height="92" rx="14" fill="#181926" stroke="#ffb300" stroke-opacity="0.55" stroke-width="1.4"/>
      <text x="24" y="58" font-size="40">📦</text>
      <text x="80" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffb300">OPEN SOURCE</text>
      <text x="80" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">61 Public Repositories</text>
      <circle cx="336" cy="18" r="3.5" fill="#ffb300">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
